# A Rust test of this directory holds its RUN lines, as a .rr test does.
config.suffixes.add('.rs')

# The rustc arguments that link the fuzzer harness of the build tree. rrc
# selects the newest rlib of the harness in the same way.
import glob
import os
_fuzzer_rlibs = glob.glob(os.path.join(config.library_path, 'libreussir_fuzzer-*.rlib'))
if _fuzzer_rlibs:
    _fuzzer_rlib = max(_fuzzer_rlibs, key=os.path.getmtime)
    _fuzzer_rmeta = os.path.splitext(_fuzzer_rlib)[0] + '.rmeta'
    config.substitutions.append((r'%reussir_fuzzer_externs', ' '.join([
        '--extern reussir_fuzzer=' + _fuzzer_rlib,
        '--extern reussir_fuzzer=' + _fuzzer_rmeta,
        '-L dependency=' + config.library_path,
    ])))
    config.available_features.add('reussir-fuzzer')
