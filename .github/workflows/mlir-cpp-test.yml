name: MLIR Backend MultiArch

# The toolchain comes from the Nix flake: the same pinned LLVM/MLIR 23,
# clang, lit, wasmer, and Rust toolchain every developer gets from
# `nix develop`, on both architectures. No apt.llvm.org, no external
# installers — a formula or repository bump upstream cannot break this
# pipeline (see the lit 23 and Homebrew LLVM 23 incidents).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the push run for a commit the merge queue has already tested. Only
  # the queue's own pushes can have such a run, so other pushes do not wait
  # for the lookup.
  merge-queue:
    if: github.event_name == 'push' && github.actor == 'github-merge-queue[bot]'
    permissions:
      actions: read
    uses: ./.github/workflows/merge-queue-tested.yml

  build:
    name: ${{ matrix.name }}
    needs: merge-queue
    if: ${{ !cancelled() && needs.merge-queue.outputs.passed != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: build-ubuntu
          - os: ubuntu-24.04-arm
            name: build-ubuntu-arm

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The rrc cargo test intermittently hit "No space left on device" while
      # writing libmlir_sys.rlib. A disk probe showed the pipeline needs only
      # ~15G of scratch, but the runner image already uses ~60G and hosted
      # runner disks vary in size, so smaller runners tip over. Reclaim the
      # large toolchains this C++/Rust/LLVM build never uses (~25G+) — Android
      # SDK, .NET, Haskell (GHC), and Swift — to restore headroom (the Nix
      # store adds its own several GB on top). Best-effort: a missing path on
      # any given image is not an error.
      - name: Free up disk space
        run: |
          before=$(df -B1 --output=avail / | tail -1)
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift || true
          after=$(df -B1 --output=avail / | tail -1)
          echo "Reclaimed $(( (after - before) / 1024 / 1024 )) MiB"
          df -h /

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      # sccache talks to the shared S3 bucket directly (no tarball round trip
      # through actions/cache), and the Nix daemon gets the same bucket as a
      # zstd binary cache for what cache.nixos.org does not serve (the fenix
      # Rust toolchain, the LLVM/MLIR join). Without credentials — pull
      # requests from forks — both fall back to local disk / cache.nixos.org.
      - name: Configure S3 caches
        uses: ./.github/actions/s3-cache
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          bucket-url: ${{ secrets.CLOUDFLARE_R2_API }}
          sccache-key-prefix: ${{ matrix.os }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Verify Nix S3 cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-probe.sh

      # Materialize the dev shell up front so toolchain substitution has its
      # own timing and log section. The shellHook writes CMakeUserPresets.json
      # (the nix-dev preset used below) on every entry.
      - name: Build dev shell
        run: nix develop --command true

      - name: Start sccache
        uses: ./.github/actions/sccache-start
        with:
          shell: default

      - name: Push dev shell closure to Nix cache
        if: env.NIX_S3_STORE != ''
        run: scripts/ci/nix-cache-push.sh default

      - name: Configure CMake
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --preset nix-dev -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DREUSSIR_ENABLE_PEDANTIC=ON \
            -DREUSSIR_ENABLE_TESTS=ON \
            -DREUSSIR_ENABLE_OPENXLA=ON \
            -DREUSSIR_RUNTIME_SANITIZERS="address;leak;memory;thread" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          '

      # Bazel builds the IFRT support archives (cmake/ifrt). Its output tree
      # holds the fetched dependencies and the result of every action, so with
      # the tree of an earlier run in place Bazel finds the build up to date
      # instead of running some 6,000 actions again. Bazel validates what it
      # finds against the inputs, so a snapshot taken from older inputs is
      # still correct, only less complete; the key names the inputs so that a
      # change to them stores a new snapshot.
      - name: Restore IFRT Bazel output
        id: ifrt-bazel
        uses: ./.github/actions/s3-dir-cache
        with:
          path: build/cmake/ifrt/cache
          key: ifrt-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/ifrt/**', 'cmake/stablehlo/**', 'flake.lock') }}
          restore-keys: |
            ifrt-bazel-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        # Also build the sanitized runtime variants here: the `check` target
        # does not depend on them, and lit decides the asan/lsan/msan/tsan
        # features by whether the libraries exist when it starts — built only
        # later (by check-sanitizer), the whole sanitizer/ suite shows up as
        # UNSUPPORTED in the main integration-test run.
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache \
            cmake --build build --parallel --target all reussir-rt-sanitizers
          '

      # The server would otherwise still own files in the tree being saved.
      - name: Stop the Bazel server
        if: steps.ifrt-bazel.outputs.cache-hit != 'true'
        run: |
          nix develop --command bash -c '
            cd build/cmake/ifrt/workspace
            bazel --output_user_root="$PWD/../cache" shutdown
          '

      - name: Save IFRT Bazel output
        if: steps.ifrt-bazel.outputs.cache-hit != 'true'
        uses: ./.github/actions/s3-dir-cache/save
        with:
          path: build/cmake/ifrt/cache
          key: ifrt-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/ifrt/**', 'cmake/stablehlo/**', 'flake.lock') }}

      # A clean Cargo home and target directory prove the extracted bundle
      # supplies every Cargo dependency. LLVM/StableHLO remain native inputs.
      #
      # sccache is named with --config here and in the other rene steps, not
      # through RUSTC_WRAPPER: the tests run cargo themselves in temporary
      # directories, and an inherited wrapper would store those builds under
      # keys that no later run can hit.
      - name: Build vendored PJRT runtime offline
        run: |
          nix develop --command bash -c '
            REUSSIR_PJRT_PATH="$PWD/build/_deps/xla-src" \
            REUSSIR_STABLEHLO_LIB_DIR="$PWD/build/lib" \
            REUSSIR_TEST_BUNDLED_PJRT=1 \
            cargo --config "build.rustc-wrapper=\"sccache\"" \
              test --locked -p rene --lib bundled_runtime_builds_locked_offline_with_an_empty_cargo_home -- --ignored
          '

      # PJRT execution tests run against the pinned prebuilt CPU plugin and
      # the PJRT-enabled runtime the build above produced. The exported
      # plugin enables the `pjrt-runtime` lit feature for the integration
      # tests below.
      - name: Prepare PJRT CPU plugin
        run: |
          scripts/ci/fetch-pjrt-cpu-plugin.sh "$RUNNER_TEMP/pjrt-cpu"
          echo "REUSSIR_PJRT_PLUGIN=$RUNNER_TEMP/pjrt-cpu/libpjrt_cpu.so" >> "$GITHUB_ENV"

      # RUSTFLAGS as in the CMake build of this target directory
      # (crates/reussir-rt/CMakeLists.txt), so the tests link the runtime
      # dependencies that build produced instead of compiling them again.
      - name: Run PJRT runtime tests
        run: |
          nix develop --command bash -c '
            env RUSTC_WRAPPER=sccache RUSTFLAGS=-Awarnings \
            CARGO_TARGET_DIR="$PWD/build/target-rt-pjrt" \
            REUSSIR_PJRT_PATH="$PWD/build/_deps/xla-src" \
            cargo test --locked --release -p reussir-rt --features pjrt -- --include-ignored
          '

      - name: Run Unit Tests
        run: |
          nix develop --command bash -c '
            cmake --build build --target reussir-ut
            ctest --test-dir build --output-on-failure
          '

      - name: Run Integration Tests
        run: nix develop --command cmake --build build --target check

      - name: Run Sanitizer Integration Tests
        run: nix develop --command cmake --build build --target check-sanitizer

      - name: Build and Test pure-Rust frontend tools
        # Pure-Rust frontend crates: the parser/CST tests and the
        # elaboration/monomorphization/ownership tests. Cheap (sub-second
        # test run) but previously never executed in CI.
        run: |
          nix develop --command bash -c '
            cmake --build build --target reussir-syntax-test
            cmake --build build --target reussir-core-test
            cmake --build build --target reussir-lsp-test
          '

      - name: Test standalone cache FFI
        run: |
          nix develop --command env RUSTC_WRAPPER=sccache \
            CARGO_TARGET_DIR="$PWD/build/target" RUSTFLAGS=-Awarnings \
            cargo test --locked --release -p reussir-polyffi-cache

      # rene lives here rather than in a standalone workflow. The lib-only
      # warm-up defuses the sailfish template-derive race: `--all-targets`
      # expands the same derive from two concurrent rustc processes, and the
      # loser gives up on the compilation lock after only one second.
      - name: Build and Test rene
        run: |
          nix develop --command bash -c '
            export REUSSIR_PJRT_PATH="$PWD/build/_deps/xla-src"
            cached=(--config "build.rustc-wrapper=\"sccache\"")
            cargo "${cached[@]}" clippy -p rene --lib
            cargo "${cached[@]}" clippy -p rene --all-targets -- -D warnings
            cargo "${cached[@]}" test -p rene
          '

      # The real thing, ignored by default because it compiles the runtime:
      # unpack the bundled sources and bake with the host toolchain offline.
      - name: Run rene host-toolchain bake test
        run: nix develop --command cargo --config 'build.rustc-wrapper="sccache"' test -p rene --test cli -- --ignored

      - name: Build and Test reussir-backend
        run: nix develop --command cmake --build build --target reussir-backend-test

      - name: Build and Test reussir-stablehlo
        run: nix develop --command cmake --build build --target reussir-stablehlo-test

      - name: Build and Test reussir-codegen
        run: nix develop --command cmake --build build --target reussir-codegen-test

      - name: Build and Test rrc
        run: nix develop --command cmake --build build --target rrc-test

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: |
          nix develop --command sccache --show-stats
          [ -f "$SCCACHE_ERROR_LOG" ] && cat "$SCCACHE_ERROR_LOG" || true
