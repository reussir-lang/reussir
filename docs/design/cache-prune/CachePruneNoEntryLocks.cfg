\* Mutation: no entry locks.  Builders are no longer exclusive; every other
\* property still holds (see README.md).
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = FALSE
  Repair = TRUE
INVARIANTS
  BuildExcl
CHECK_DEADLOCK FALSE
