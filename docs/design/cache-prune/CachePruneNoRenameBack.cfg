\* Mutation: a failed commit keeps its renames, so a live row lacks its
\* directory while the failing session still lives.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = FALSE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  LiveHasDir
CHECK_DEADLOCK FALSE
