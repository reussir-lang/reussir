\* Mutation: the publisher renames into place outside the transaction that
\* writes the row, so a prune in between takes the directory for debris.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = FALSE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  UseSafety
CHECK_DEADLOCK FALSE
