\* Mutation: builds prune only when the size limit asks, with no hourly
\* repair, so what a crash left may stay forever.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = FALSE
PROPERTIES
  Recovery
CHECK_DEADLOCK FALSE
