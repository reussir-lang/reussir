\* Mutation: the sweep also deletes the staging and trash of live sessions,
\* so a failing commit cannot rename back (and a builder loses its staging).
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = FALSE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  LiveHasDir
CHECK_DEADLOCK FALSE
