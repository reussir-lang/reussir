\* Mutation: the pruner decides and deletes the rows in its transaction,
\* and renames the victims after the commit, so a session that pins and
\* republishes the key in between loses its entry.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = FALSE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  UseSafety
CHECK_DEADLOCK FALSE
