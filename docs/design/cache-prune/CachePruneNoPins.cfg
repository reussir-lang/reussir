\* Mutation: a lookup does not pin the key it asks for, so the pruner
\* removes an entry a session uses.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = FALSE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  UseSafety
CHECK_DEADLOCK FALSE
