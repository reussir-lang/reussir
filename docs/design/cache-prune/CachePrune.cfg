\* The protocol: every rule in force.  p1 never crashes or fails a commit;
\* p2 and p3 may do either.  k1 is read in place, k2 copied out.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = TRUE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  TypeOK
  UseSafety
  PinsHeld
  RemovedUnpinned
  LiveHasDir
  RowlessIsDebris
  Owned
  BuildExcl
PROPERTIES
  Progress
  Recovery
CHECK_DEADLOCK FALSE
