\* Mutation: a lookup trusts a live row without checking its directory, so
\* a session uses an entry an interrupted prune renamed away.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2, p3}
  Reliable = {p1}
  Keys = {k1, k2}
  InPlace = {k1}
  NULL = NULL
  ReadersPin = TRUE
  PruneInTxn = TRUE
  PublishInTxn = TRUE
  RenameBack = TRUE
  DirCheck = FALSE
  SweepDeadOnly = TRUE
  EntryLocks = TRUE
  Repair = TRUE
INVARIANTS
  UseSafety
CHECK_DEADLOCK FALSE
